<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mytodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
     
     <style>
      
      body{
        font-family: "Trirong", serif;
        background-color:lavenderblush;
      }
      nav{
        background-color:lightgray;
      }
    </style>
   
  </head>

  <body>
 
    <nav class="navbar navbar-expand-lg ">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">MY TODO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-3">
      <div class="row justify-content-center">
        <div class="col-md-9">
          <h2>ADD A TODO</h2>
          <form id="todoForm" action="/todo" method="POST">
            <div class="mb-3">
              <label for="title" class="form-label">Todo Title:</label>
              <input type="text" class="form-control" id="title" required>
            </div>
            <div class="mb-3">
              <label for="desc" class="form-label">Todo Description:</label>
              <input type="text" class="form-control" id="desc" required>
            </div>
            <button type="submit" class="btn btn-primary">SUBMIT</button>
          </form>
        </div>
      </div>
    </div>
   
    <div class="container my-3">
      <div class="row justify-content-center">
        <div class="col-md-9 table-responsive">
          <h2>YOUR TODOS</h2>
          <table class="table table-bordered border-primary-subtle">
            <thead>
              <tr>
                <th scope="col">SrNo</th>
                <th scope="col">Title</th>
                <th scope="col">Description</th>
                <th scope="col">Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="todoTableBody"></tbody>
          </table>
        </div>
      </div>
     </div>

   
    <script src="{{url_for('static',filename='script.js')}}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
